name: Déploiement sur WordPress.org

# Se lance quand un tag est poussé (par exemple en publiant une release « 1.0.0 » sur GitHub).
on:
  push:
    tags:
      - "*"

jobs:
  tag:
    name: Nouvelle version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Envoi vers le SVN de WordPress.org
        uses: 10up/action-wordpress-plugin-deploy@stable
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: entrystage
